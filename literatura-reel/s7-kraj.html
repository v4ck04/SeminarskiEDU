<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/lux.css">
<style>
  #root { background: radial-gradient(1100px 1300px at 50% 36%, #10204A 0%, #070D1F 50%, #020307 100%); }
  .halo { position: absolute; left: 190px; top: 160px; width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(212,175,106,.22), rgba(212,175,106,0)); }
  .logo { position: absolute; left: 390px; top: 360px; width: 300px; height: 300px; }
  .logo svg { width: 100%; height: 100%; overflow: visible; }
  .main { position: absolute; left: 70px; right: 70px; top: 770px; text-align: center; z-index: 10; color: #fff; }
  .main .title { font-size: 70px; line-height: 1.18; }
  .word { position: absolute; left: 0; right: 0; top: 1030px; text-align: center; font-family: var(--serif); font-weight: 700; font-size: 104px; letter-spacing: .01em; }
  .rule2 { position: absolute; left: 50%; top: 1180px; height: 3px; background: var(--goldgrad); transform: translateX(-50%); border-radius: 2px; }
  .cta { position: absolute; left: 0; right: 0; top: 1220px; text-align: center; font-family: var(--ui); font-weight: 500; font-size: 46px; color: #fff; }
  .handle { position: absolute; left: 0; right: 0; top: 1300px; text-align: center; font-family: var(--display); font-weight: 600; font-size: 34px; letter-spacing: .08em; color: var(--gold); }
</style>
</head>
<body>
<div id="root">
  <canvas class="fx" id="fx"></canvas>
  <div class="halo" id="halo"></div>
  <div class="logo" id="logo">
    <svg viewBox="0 0 300 300">
      <defs>
        <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#9C7A3C"/><stop offset=".45" stop-color="#F7E6B5"/><stop offset="1" stop-color="#A9843F"/>
        </linearGradient>
      </defs>
      <circle id="ring" cx="150" cy="150" r="138" fill="none" stroke="url(#gg)" stroke-width="5" pathLength="1" stroke-dasharray="1 1"/>
      <circle cx="150" cy="150" r="122" fill="none" stroke="#D4AF6A" stroke-opacity=".35" stroke-width="1.5"/>
      <g id="mono">
        <!-- open book -->
        <path d="M78 196 Q114 180 150 196 Q186 180 222 196 V214 Q186 198 150 214 Q114 198 78 214 Z" fill="url(#gg)"/>
        <text x="150" y="176" text-anchor="middle" font-family="Playfair Display" font-style="italic" font-weight="700" font-size="112" fill="url(#gg)">SE</text>
      </g>
    </svg>
  </div>
  <div class="vignette"></div>
  <canvas class="grain" id="grain"></canvas>
  <div class="main">
    <h1 class="title" data-words="0.9" data-stagger="0.07">
      <span class="ln">Kvalitetan rad počinje</span>
      <span class="ln"><span class="w gold" data-shine="1.6">kvalitetnom</span> <span class="w gold" data-shine="1.7">literaturom.</span></span>
    </h1>
  </div>
  <div class="word gold" id="word" data-shine="2.0">SeminarskiEdu</div>
  <div class="rule2" id="rule2"></div>
  <div class="cta" data-in="2.5">Prati nas za još akademskih saveta.</div>
  <div class="handle" data-in="2.75">@seminarski_edu</div>
</div>
<script type="module">
import { shot, E, seg } from './lib/lux.js';
const ring = document.getElementById('ring'), mono = document.getElementById('mono'), logo = document.getElementById('logo');
const word = document.getElementById('word'), rule2 = document.getElementById('rule2'), halo = document.getElementById('halo');
shot({
  duration: 4, dust: 110, seed: 71,
  frame(t) {
    const d = E.inOutCubic(seg(t, 0.05, 1.0));
    ring.setAttribute('stroke-dashoffset', 1 - d);
    const m = E.outCubic(seg(t, 0.4, 0.7));
    mono.style.opacity = m;
    logo.style.transform = `scale(${0.94 + 0.06 * m + 0.012 * t})`;
    halo.style.opacity = (0.6 + 0.4 * Math.sin(t * 1.6)) * m;
    const w = E.outCubic(seg(t, 1.8, 0.8));
    word.style.opacity = w; word.style.transform = `translateY(${(1 - w) * 30}px)`; word.style.letterSpacing = `${0.12 - 0.11 * w}em`;
    rule2.style.width = `${E.outCubic(seg(t, 2.2, 0.8)) * 320}px`;
  },
});
</script>
</body>
</html>

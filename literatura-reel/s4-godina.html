<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/lux.css">
<link rel="stylesheet" href="lib/props.css">
<style>
  #laptop { left: 130px; top: 820px; transform: scale(1.08); transform-origin: 50% 0; }
  #laptop .lid { height: 560px; }
  #laptop .base { width: 880px; }
  .app { position: absolute; inset: 0; background: #F2F3F7; font-family: var(--ui); }
  .app .top { height: 54px; background: #0F1C3D; display: flex; align-items: center; padding: 0 22px; gap: 10px; }
  .app .top span { width: 12px; height: 12px; border-radius: 50%; background: #3A4A75; }
  .app .top b { margin-left: 18px; height: 12px; width: 220px; border-radius: 6px; background: #2C3D6B; }
  .list { padding: 18px 26px; }
  .it { display: flex; align-items: center; gap: 18px; padding: 14px 18px; margin-bottom: 10px; background: #fff; border-radius: 10px;
    box-shadow: 0 2px 6px rgba(15,28,61,.08); }
  .ic { width: 34px; height: 42px; border-radius: 4px; background: #E3E6EE; position: relative; flex: none; }
  .ic::after { content: ''; position: absolute; left: 7px; right: 7px; top: 12px; height: 3px; background: #A3ABBE; box-shadow: 0 7px 0 #A3ABBE, 0 14px 0 #A3ABBE; }
  .tx { flex: 1; }
  .tx i { display: block; height: 11px; border-radius: 6px; background: #2A3550; margin-bottom: 9px; }
  .tx i + i { background: #B9C0CF; height: 9px; margin: 0; }
  .yr { flex: none; font-family: var(--display); font-weight: 700; font-size: 26px; padding: 7px 14px; border-radius: 8px; color: #0F1C3D; background: #E9ECF3; }
  .it.new .yr { background: linear-gradient(120deg, #B8924C, #E9CD8D); color: #1A1306; }
  .it.old { transition: none; }
  .it.new.hl::after { inset: -6px; border-radius: 14px; }
</style>
</head>
<body>
<div id="root">
  <div class="stage">
    <div class="cam" id="cam">
      <div class="lampglow" style="left:300px;top:560px"></div>
      <div class="desk" style="top:1360px"></div>
      <div class="laptop" id="laptop">
        <div class="lid"><div class="screen"><div class="app">
          <div class="top"><span></span><span></span><span></span><b></b></div>
          <div class="list">
            <div class="it new hl" data-at="1.5" id="a"><div class="ic"></div><div class="tx"><i style="width:86%"></i><i style="width:60%"></i></div><div class="yr">2024</div></div>
            <div class="it new hl" data-at="1.8" id="b"><div class="ic"></div><div class="tx"><i style="width:74%"></i><i style="width:52%"></i></div><div class="yr">2023</div></div>
            <div class="it new hl" data-at="2.1" id="c"><div class="ic"></div><div class="tx"><i style="width:80%"></i><i style="width:58%"></i></div><div class="yr">2022</div></div>
            <div class="it old" id="d"><div class="ic"></div><div class="tx"><i style="width:70%"></i><i style="width:45%"></i></div><div class="yr">2006</div></div>
            <div class="it old" id="e"><div class="ic"></div><div class="tx"><i style="width:78%"></i><i style="width:50%"></i></div><div class="yr">1998</div></div>
          </div>
        </div></div></div>
        <div class="base"></div>
      </div>
    </div>
  </div>
  <canvas class="fx" id="fx"></canvas>
  <div class="scrim"></div>
  <div class="vignette"></div>
  <canvas class="grain" id="grain"></canvas>
  <div class="brand">SeminarskiEdu</div>
  <div class="head">
    <h1 class="title" data-words="0.45" data-stagger="0.08">
      <span class="ln"><span class="w gold num" data-shine="0.7">03</span> <span class="w bar">|</span> Obrati pažnju</span>
      <span class="ln">na godinu izdanja</span>
    </h1>
    <div class="rule" data-at="1.05" data-w="200"></div>
    <p class="sub" data-words="1.3" data-stagger="0.05">
      <span class="ln">Za savremene teme koristi</span>
      <span class="ln">aktuelna istraživanja.</span>
    </p>
  </div>
</div>
<script type="module">
import { shot, camera, E, seg } from './lib/lux.js';
const cam = document.getElementById('cam');
shot({
  duration: 4.5, fadeIn: 0.5, fadeOut: 0.5, dust: 30, seed: 41,
  frame(t) {
    camera(cam, t, [
      { t: 0, x: 540, y: 1150, s: 1.0, sy: 1150 },
      { t: 4.5, x: 540, y: 1100, s: 1.07, sy: 1150, ease: E.linear },
    ]);
    const d = seg(t, 2.4, 0.6);
    ['d', 'e'].forEach(id => { document.getElementById(id).style.opacity = 1 - 0.6 * d; document.getElementById(id).style.filter = `grayscale(${d})`; });
    ['a', 'b', 'c'].forEach((id, i) => {
      const p = E.outBack(seg(t, 1.5 + i * 0.3, 0.5));
      document.getElementById(id).style.transform = `scale(${1 + 0.025 * p})`;
    });
  },
});
</script>
</body>
</html>
